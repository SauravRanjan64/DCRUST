version: '3.8'

services:
  mongodb:
    image: mongo:8
    container_name: dcrust_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: dcrust
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dcrust_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: dcrust_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/dcrust
      JWT_SECRET: super_secret_jwt_key_for_dcrust_placement_system_2026
      JWT_EXPIRES_IN: 7d
      COOKIE_NAME: dcrust_auth_token
      CORS_ORIGIN: http://localhost:5173,http://localhost:3000
      REDIS_URL: redis://redis:6379
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  mongodata:
  redisdata:
